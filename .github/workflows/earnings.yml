name: Earnings calendar refresh

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: Sources to refresh
        type: choice
        options:
          - all
          - finnhub
          - alpha_vantage
        default: all

permissions:
  contents: read

concurrency:
  group: tickipate-earnings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TICKIPATE_SYMBOLS: ${{ vars.TICKIPATE_SYMBOLS }}
      SOURCES: ${{ inputs.sources || 'all' }}
    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" || -z "$TICKIPATE_SYMBOLS" ]]; then
            echo 'Set DATABASE_URL and TICKIPATE_SYMBOLS before enabling ingestion.'
            exit 0
          fi
          if [[ "$SOURCES" != 'alpha_vantage' && -z "$FINNHUB_API_KEY" ]]; then
            echo 'FINNHUB_API_KEY is required for the selected sources.'
            exit 0
          fi
          if [[ "$SOURCES" != 'finnhub' && -z "$ALPHA_VANTAGE_API_KEY" ]]; then
            echo 'ALPHA_VANTAGE_API_KEY is required for the selected sources.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
        if: steps.config.outputs.ready == 'true'
      - name: Refresh earnings
        if: steps.config.outputs.ready == 'true'
        run: python -m backend.ingestion.refresh --sources "$SOURCES" --symbols "$TICKIPATE_SYMBOLS"
